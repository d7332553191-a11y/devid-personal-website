<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Study with Devid</title>

    <script>

let currentClass = 0;

function openClass(classNumber) {

    currentClass = classNumber;

    document.getElementById("classContent").innerHTML = `
        <h3>📚 Class ${classNumber}</h3>
        <p>Select a subject:</p>

        <button onclick="openSubject('Maths')">📐 Maths</button>
        <button onclick="openSubject('Science')">🔬 Science</button>
        <button onclick="openSubject('English')">📖 English</button>
        <button onclick="openSubject('Hindi')">📝 Hindi</button>
        <button onclick="openSubject('Social Science')">🌍 Social Science</button>
        <button onclick="openSubject('Computer')">💻 Computer</button>
    `;
}


function openSubject(subject) {

    if (currentClass === 9 || currentClass === 10) {

        if (subject === "Science") {

            document.getElementById("classContent").innerHTML = `
                <h3>🔬 Science</h3>
                <p>Select a subject:</p>

                <button onclick="openSubject('Physics')">⚛️ Physics</button>
                <button onclick="openSubject('Chemistry')">🧪 Chemistry</button>
                <button onclick="openSubject('Biology')">🧬 Biology</button>
            `;

            return;
        }

        if (subject === "Social Science") {

            document.getElementById("classContent").innerHTML = `
                <h3>🌍 Social Science</h3>
                <p>Select a subject:</p>

                <button onclick="openSubject('History')">📜 History</button>
                <button onclick="openSubject('Geography')">🌍 Geography</button>
                <button onclick="openSubject('Civics')">🏛️ Civics</button>
                <button onclick="openSubject('Economics')">💰 Economics</button>
            `;

            return;
        }
    }


    document.getElementById("classContent").innerHTML = `
        <h3>📚 ${subject}</h3>
        <p>Select a chapter:</p>

        <button onclick="openChapter('Chapter 1')">Chapter 1</button>
        <button onclick="openChapter('Chapter 2')">Chapter 2</button>
        <button onclick="openChapter('Chapter 3')">Chapter 3</button>
        <button onclick="openChapter('Chapter 4')">Chapter 4</button>
        <button onclick="openChapter('Chapter 5')">Chapter 5</button>
    `;
}


function openChapter(chapter) {

    document.getElementById("classContent").innerHTML = `
        <h3>📖 ${chapter}</h3>
        <p>Notes for this chapter</p>

        <input
            type="file"
            id="noteFile"
            accept=".pdf,.doc,.docx,.jpg,.jpeg,.png"
        >

        <br>

        <button onclick="uploadNote()">📤 Upload Note</button>

        <p id="uploadStatus"></p>

        <button onclick="downloadNotes()">⬇️ Download Notes</button>
    `;
}


async function uploadNote() {

    const fileInput = document.getElementById("noteFile");
    const status = document.getElementById("uploadStatus");

    if (!fileInput.files.length) {

        status.textContent = "Pehle file select karo.";

        return;
    }

    const file = fileInput.files[0];
    const filePath = Date.now() + "_" + file.name;

    status.textContent = "Uploading...";

    const { error } = await supabaseClient
        .storage
        .from("notes")
        .upload(filePath, file);

    if (error) {

        status.textContent =
            "Upload failed: " + error.message;

        return;
    }

    status.textContent =
        "✅ Note uploaded successfully!";
}


async function downloadNotes() {

    const { data, error } = await supabaseClient
        .storage
        .from("notes")
        .list("", {
            limit: 100
        });

    if (error) {

        alert(
            "Notes load nahi ho sake: " +
            error.message
        );

        return;
    }

    if (!data || data.length === 0) {

        alert("Abhi koi note available nahi hai.");

        return;
    }

    const file = data[0];

    const { data: urlData, error: urlError } =
        await supabaseClient
            .storage
            .from("notes")
            .createSignedUrl(file.name, 60 * 60);

    if (urlError) {

        alert(
            "Download link nahi bana: " +
            urlError.message
        );

        return;
    }

    window.open(urlData.signedUrl, "_blank");
}

);
  </script>  
</body>
</html>
