<body>

<nav>
    <a href="#home">Home</a>

<section id="home">

</section>

<section id="notes">
    <h2>📚 Study Notes</h2>
    <p>Select your class</p>

    <div class="class-grid">
        <button onclick="openClass(1)">Class 1</button>
        <button onclick="openClass(2)">Class 2</button>
        <button onclick="openClass(3)">Class 3</button>
        <button onclick="openClass(4)">Class 4</button>
        <button onclick="openClass(5)">Class 5</button>
        <button onclick="openClass(6)">Class 6</button>
        <button onclick="openClass(7)">Class 7</button>
        <button onclick="openClass(8)">Class 8</button>
        <button onclick="openClass(9)">Class 9</button>
        <button onclick="openClass(10)">Class 10</button>
        <button onclick="openClass(11)">Class 11</button>
        <button onclick="openClass(12)">Class 12</button>
    </div>

    <div id="classContent"></div>
</section>

<section id="login">
    <h2>🔐 Student Login</h2>
    <p>Student login system will be added here.</p>
</section>

<section id="chat">

    <p>Students can ask their problems here.</p>
</section>

<section id="contact">

    <a class="btn" href="https://www.instagram.com/Indian_boy_872681/" target="_blank">
        Contact on Instagram
    </a>
</section>
<script>

function openClass(classNumber) {
    document.getElementById("classContent").innerHTML = `
        <h3>📚 Class ${classNumber}</h3>
        <p>Select a subject:</p>

        <button onclick="openSubject('Maths')">📐 Maths</button>
        <button onclick="openSubject('Science')">🔬 Science</button>
        <button onclick="openSubject('English')">📖 English</button>
        <button onclick="openSubject('Hindi')">📝 Hindi</button>
        <button onclick="openSubject('Social Science')">🌍 Social Science</button>
        <button onclick="openSubject('Computer')">💻 Computer</button>
    `;
}

function openSubject(subject) {
    document.getElementById("classContent").innerHTML = `
        <h3>📚 ${subject}</h3>
        <p>Select a chapter:</p>

        <button onclick="openChapter('Chapter 1')">Chapter 1</button>
        <button>Chapter 2</button>
        <button>Chapter 3</button>
        <button>Chapter 4</button>
        <button>Chapter 5</button>
    `;
}

function openChapter(chapter) {
    document.getElementById("classContent").innerHTML = `
        <h3>📖 ${chapter}</h3>
        <p>Notes for this chapter</p>

        <input type="file" id="noteFile" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png">
        <button>⬇️ Download Notes</button>
    `;
}

</script>
